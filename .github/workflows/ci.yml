name: CI

# Pull requests are what this exists for: main is protected on the `build` job
# below, so nothing reaches main without one of these going green. Pushes to
# main are still built, to catch a merge that is broken by its own merge commit
# rather than by either parent.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to a branch makes the first run pointless. Main is exempt: its
# history is what the badge and the protection rule are about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Both platforms the manifest claims (ADR 0020). The transport is a Unix
  # socket on one and a named pipe on the other, and each is tested against a
  # real one; the boards themselves have opt-in tests that need the hardware.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform should not hide the state of the other.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # go.mod pins the exact toolchain, the same one release builds need.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      # The binary the manifest runs, at the path it runs it from, built and
      # started on each runner. Whether Herdr's launcher resolves the
      # extensionless argv to herdrkeys.exe was checked by hand for herdrcolor
      # against Herdr 0.9.5; CI has no Herdr to ask.
      - run: go build -o bin/herdrkeys${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/herdrkeys
      - run: ./bin/herdrkeys version
        shell: bash

  # Every release target must build, and builds must be reproducible: install
  # checks each download against sums committed before CI builds anything. This
  # builds everything twice and compares. It does not compare against
  # checksums.txt, which describes the release the manifest names, not the
  # source on this branch.
  release-targets:
    name: release targets build reproducibly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./tools/release
      - run: rm -rf dist && go run ./tools/release -check
      - run: git checkout -- checksums.txt

  # The install scripts, against a locally built "release": a good binary must
  # install, and a tampered one must be refused.
  fetch:
    name: fetch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # No daemon in CI: there is no Herdr and no board to start it for.
      HERDRKEYS_NO_START: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./tools/release

      - name: fetch.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HERDRKEYS_RELEASE_URL="file://$PWD/dist"
          sh ./bin/fetch.sh
          ./bin/herdrkeys version
          rm bin/herdrkeys
          mkdir bad && for f in dist/*; do cp "$f" bad/ && echo x >> "bad/$(basename "$f")"; done
          if HERDRKEYS_RELEASE_URL="file://$PWD/bad" sh ./bin/fetch.sh; then
            echo "a tampered binary was installed"; exit 1
          fi
          test ! -e bin/herdrkeys

      - name: fetch.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HERDRKEYS_RELEASE_URL = "file:///$($PWD.Path -replace '\\','/')/dist"
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/fetch.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./bin/herdrkeys.exe version
          Remove-Item bin/herdrkeys.exe
          New-Item -ItemType Directory bad | Out-Null
          Get-ChildItem dist | ForEach-Object {
            Copy-Item $_.FullName bad/
            Add-Content -Path "bad/$($_.Name)" -Value 'x'
          }
          $env:HERDRKEYS_RELEASE_URL = "file:///$($PWD.Path -replace '\\','/')/bad"
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/fetch.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error 'a tampered binary was installed'; exit 1 }
          if (Test-Path bin/herdrkeys.exe) { Write-Error 'tampered binary left behind'; exit 1 }
          exit 0

  # The firmware stays CircuitPython (ADR 0020), so it is still tested under
  # CPython: device/code.py run against stand-in libraries, and the logo
  # baker that writes the masks the CN001's drawing embeds.
  firmware:
    name: firmware and logos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  # The one check main is protected on. Requiring the matrix jobs directly
  # would pin the protection rule to their generated names, so adding a runner
  # would silently stop being required. This gate is a stable name that fails
  # whenever anything it needs does.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test, release-targets, fetch, firmware]
    if: always()
    steps:
      - name: Check that everything passed
        run: |
          echo "test:             ${{ needs.test.result }}"
          echo "release-targets:  ${{ needs.release-targets.result }}"
          echo "fetch:            ${{ needs.fetch.result }}"
          echo "firmware:         ${{ needs.firmware.result }}"
          [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.release-targets.result }}" = "success" ] \
            && [ "${{ needs.fetch.result }}" = "success" ] \
            && [ "${{ needs.firmware.result }}" = "success" ]
